<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="body" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0%" stop-color="#d8b8e8"/>
      <stop offset="55%" stop-color="#8a4fb0"/>
      <stop offset="100%" stop-color="#3d1f5c"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.4" cy="0.4" r="0.75">
      <stop offset="0%" stop-color="#ffe98a"/>
      <stop offset="60%" stop-color="#e88a1f"/>
      <stop offset="100%" stop-color="#7a3a08"/>
    </radialGradient>
    <radialGradient id="sclera" cx="0.4" cy="0.4" r="0.8">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dcd0c4"/>
    </radialGradient>
  </defs>
  <!-- floating shadow (small + faint = airborne) -->
  <ellipse cx="32" cy="60" rx="15" ry="2" fill="rgba(0,0,0,0.3)"/>
  <!-- bigger bat wings (behind body) -->
  <path d="M13 17 Q1 7 1 22 Q4 22 5 26 Q7 23 8 26 Q11 25 13 27 Z"
        fill="#5d2f8c" stroke="#2a1240" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M51 17 Q63 7 63 22 Q60 22 59 26 Q57 23 56 26 Q53 25 51 27 Z"
        fill="#5d2f8c" stroke="#2a1240" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- spherical body -->
  <ellipse cx="32" cy="30" rx="24" ry="22" fill="url(#body)" stroke="#2a1240" stroke-width="1.5"/>
  <!-- single horn (on top of head) -->
  <path d="M28 9 Q30 2 32 1 Q34 3 36 9 Z"
        fill="#3d1f5c" stroke="#2a1240" stroke-width="0.8" stroke-linejoin="round"/>
  <ellipse cx="30" cy="5" rx="0.8" ry="2" fill="rgba(255,255,255,0.35)"/>
  <!-- glossy top highlight -->
  <ellipse cx="22" cy="14" rx="9" ry="4.5" fill="rgba(255,255,255,0.45)"/>
  <ellipse cx="14" cy="22" rx="2.5" ry="3.5" fill="rgba(255,255,255,0.3)"/>
  <!-- huge central eye -->
  <circle cx="32" cy="26" r="13" fill="url(#sclera)" stroke="#2a1240" stroke-width="1.2"/>
  <!-- iris -->
  <circle cx="32" cy="27" r="7.5" fill="url(#iris)" stroke="#5a2a04" stroke-width="0.6"/>
  <!-- vertical slit pupil -->
  <ellipse cx="32" cy="27" rx="1.6" ry="5" fill="#0a0508"/>
  <!-- eye shine -->
  <circle cx="29" cy="23" r="2" fill="#ffffff"/>
  <circle cx="35" cy="30" r="0.8" fill="#ffffff"/>
  <!-- mouth: dark grimace -->
  <path d="M 16 44 Q 32 50 48 44 Q 50 49 46 51 Q 32 54 18 51 Q 14 49 16 44 Z"
        fill="#1a0510" stroke="#2a1240" stroke-width="1" stroke-linejoin="round"/>
  <!-- top fangs -->
  <path d="M 18 44 L 21 47 L 24 44 L 27 47 L 30 44 L 33 47 L 36 44 L 39 47 L 42 44 L 45 47 L 46 44 Z"
        fill="#f0e4d0" stroke="#2a1240" stroke-width="0.3"/>
  <!-- bottom fangs -->
  <path d="M 19 51 L 22 48 L 25 51 L 28 48 L 31 51 L 34 48 L 37 51 L 40 48 L 43 51 L 45 51 Z"
        fill="#f0e4d0" stroke="#2a1240" stroke-width="0.3"/>
</svg>
