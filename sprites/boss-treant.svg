<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2d20"/>
      <stop offset="50%" stop-color="#1f160d"/>
      <stop offset="100%" stop-color="#080503"/>
    </linearGradient>
    <radialGradient id="leaf" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#ffd28a"/>
      <stop offset="55%" stop-color="#c8472a"/>
      <stop offset="100%" stop-color="#5a1a08"/>
    </radialGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#eaffd8"/>
      <stop offset="45%" stop-color="#7fd66a"/>
      <stop offset="100%" stop-color="#1d5520"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="32" cy="58" rx="22" ry="3" fill="rgba(0,0,0,0.4)"/>

  <!-- canopy: layered foliage clumps in autumn red -->
  <ellipse cx="20" cy="14" rx="10" ry="7" fill="url(#leaf)" stroke="#3a0a02" stroke-width="1"/>
  <ellipse cx="44" cy="12" rx="11" ry="8" fill="url(#leaf)" stroke="#3a0a02" stroke-width="1"/>
  <ellipse cx="32" cy="16" rx="12" ry="7" fill="url(#leaf)" stroke="#3a0a02" stroke-width="1"/>
  <!-- canopy highlights (warm sunlight) -->
  <ellipse cx="16" cy="11" rx="4" ry="2" fill="rgba(255,220,140,0.35)"/>
  <ellipse cx="40" cy="9" rx="5" ry="2" fill="rgba(255,220,140,0.35)"/>

  <!-- left branch arm with claw -->
  <path d="M16 30 Q8 30 4 22 Q3 18 7 18 Q7 26 14 27 L16 30Z"
        fill="url(#bark)" stroke="#050302" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M4 22 L1 19 M5 21 L2 16 M7 21 L6 15"
        stroke="#050302" stroke-width="0.9" stroke-linecap="round" fill="none"/>

  <!-- right branch arm with claw -->
  <path d="M48 30 Q56 30 60 22 Q61 18 57 18 Q57 26 50 27 L48 30Z"
        fill="url(#bark)" stroke="#050302" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M60 22 L63 19 M59 21 L62 16 M57 21 L58 15"
        stroke="#050302" stroke-width="0.9" stroke-linecap="round" fill="none"/>

  <!-- main trunk -->
  <path d="M16 24 Q14 36 15 48 Q15 54 19 56 L45 56 Q49 54 49 48 Q50 36 48 24 Q44 19 32 19 Q20 19 16 24Z"
        fill="url(#bark)" stroke="#050302" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- bark cracks -->
  <path d="M22 26 Q21 38 24 50" fill="none" stroke="#050302" stroke-width="0.8" stroke-linecap="round" opacity="0.85"/>
  <path d="M31 27 Q30 38 32 50" fill="none" stroke="#050302" stroke-width="0.8" stroke-linecap="round" opacity="0.85"/>
  <path d="M42 28 Q41 40 39 50" fill="none" stroke="#050302" stroke-width="0.8" stroke-linecap="round" opacity="0.85"/>

  <!-- moss/lichen tufts on shoulders, now rust-orange -->
  <path d="M14 22 Q20 19 26 23 Q20 25 14 24Z" fill="#9c4520" opacity="0.9"/>
  <path d="M38 23 Q44 19 50 22 Q44 25 38 24Z" fill="#9c4520" opacity="0.9"/>
  <circle cx="18" cy="22" r="1" fill="#ffc888" opacity="0.85"/>
  <circle cx="46" cy="22" r="1" fill="#ffc888" opacity="0.85"/>

  <!-- roots / feet -->
  <path d="M15 53 Q9 58 6 56 Q9 52 14 50Z" fill="url(#bark)" stroke="#050302" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M49 53 Q55 58 58 56 Q55 52 50 50Z" fill="url(#bark)" stroke="#050302" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M22 56 L22 60 L27 60 L27 56Z" fill="#050302"/>
  <path d="M37 56 L37 60 L42 60 L42 56Z" fill="#050302"/>

  <!-- hollow eye sockets -->
  <ellipse cx="24" cy="34" rx="5" ry="4.5" fill="#050302"/>
  <ellipse cx="40" cy="34" rx="5" ry="4.5" fill="#050302"/>
  <!-- glowing green eyes (kept green for eerie contrast against red leaves) -->
  <circle cx="24" cy="34" r="3" fill="url(#eye)"/>
  <circle cx="40" cy="34" r="3" fill="url(#eye)"/>
  <circle cx="24" cy="34" r="1.3" fill="#050302"/>
  <circle cx="40" cy="34" r="1.3" fill="#050302"/>
  <circle cx="24.5" cy="33.5" r="0.7" fill="#ffffff"/>
  <circle cx="40.5" cy="33.5" r="0.7" fill="#ffffff"/>

  <!-- jagged splintered mouth -->
  <path d="M22 44 L26 42 L29 45 L32 42 L35 45 L38 42 L42 44 L40 48 L36 46 L32 48 L28 46 L24 48Z"
        fill="#050302" stroke="#0a0604" stroke-width="0.4" stroke-linejoin="round"/>

  <!-- bottom shading on trunk -->
  <path d="M16 50 Q32 56 48 50 L48 54 Q32 58 16 54Z" fill="rgba(0,0,0,0.35)"/>

  <!-- a couple of falling leaves drifting down (extra autumn flavor) -->
  <ellipse cx="6"  cy="44" rx="1.4" ry="0.9" fill="#c8472a" opacity="0.85" transform="rotate(20 6 44)"/>
  <ellipse cx="58" cy="40" rx="1.2" ry="0.8" fill="#ffd28a" opacity="0.8"  transform="rotate(-30 58 40)"/>
  <ellipse cx="10" cy="54" rx="1.2" ry="0.8" fill="#9c4520" opacity="0.8"  transform="rotate(45 10 54)"/>
</svg>
