<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -5 48 61" width="48" height="61">
  <!-- Hootling: original owl/moth companion (front/down view). Original IP —
       redrawn clean & riggable, inspired by a low-poly owl silhouette. Idle life
       is baked in (animates even as an <img>/background): a gentle wing flutter,
       a soft head bob (breathing), and an occasional blink. The WALK bob is NOT
       here — the game adds that via a .walking class only while it moves. -->
  <defs>
    <linearGradient id="ho-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdc7e0"/><stop offset="1" stop-color="#a79fc1"/></linearGradient>
    <linearGradient id="ho-wing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcd8ea"/><stop offset="1" stop-color="#b1aac9"/></linearGradient>
    <linearGradient id="ho-belly" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf4ef"/><stop offset="1" stop-color="#ecdfe6"/></linearGradient>
    <linearGradient id="ho-mask" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5b62"/><stop offset="1" stop-color="#513a44"/></linearGradient>
    <linearGradient id="ho-beak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c3a6"/><stop offset="1" stop-color="#dc9f91"/></linearGradient>
    <style>
      /* idle wing flutter — each wing rocks about its root (near the body) */
      .ho-wing-l, .ho-wing-r { transform-box: fill-box; }
      .ho-wing-l { transform-origin: right center; animation: ho-flap-l 1.5s ease-in-out infinite; }
      .ho-wing-r { transform-origin: left  center; animation: ho-flap-r 1.5s ease-in-out infinite; animation-delay: -0.18s; }
      @keyframes ho-flap-l { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(3.5deg); } }
      @keyframes ho-flap-r { 0%,100% { transform: rotate(2deg);  } 50% { transform: rotate(-3.5deg); } }
      /* idle head bob (gentle breathing nod) */
      .ho-head { transform-box: fill-box; transform-origin: center bottom; animation: ho-bob 2.8s ease-in-out infinite; }
      @keyframes ho-bob {
        0%, 100% { transform: translateY(0)     rotate(-0.6deg); }
        50%      { transform: translateY(-0.7px) rotate(0.6deg); }
      }
      /* occasional blink */
      .ho-eyes { transform-box: fill-box; transform-origin: center center; animation: ho-blink 5s ease-in-out infinite; }
      @keyframes ho-blink {
        0%, 90%, 100% { transform: scaleY(1); }
        94%, 96%      { transform: scaleY(0.08); }
      }
    </style>
  </defs>

  <ellipse cx="24" cy="55" rx="14" ry="3" fill="#000" opacity="0.16"/>

  <!-- wings (behind body, flutter gently) -->
  <g fill="url(#ho-wing)" stroke="#5b5170" stroke-width="1.1" stroke-linejoin="round">
    <path class="ho-wing-l" d="M18,28 C11,25 3,27 3,34 Q5,35 4.5,37 Q7,37 7,39 Q9,38.5 9.5,40.5 Q12,40 12.5,42 Q15,41 18,39 Z"/>
    <path class="ho-wing-r" d="M30,28 C37,25 45,27 45,34 Q43,35 43.5,37 Q41,37 41,39 Q39,38.5 38.5,40.5 Q36,40 35.5,42 Q33,41 30,39 Z"/>
  </g>
  <!-- yellow feather accents on the wing tips -->
  <g stroke="#f0ecb0" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.85">
    <path class="ho-wing-l" d="M6,33 L4.5,36 M9,33 L7.5,37 M12,33.5 L10.5,38"/>
    <path class="ho-wing-r" d="M42,33 L43.5,36 M39,33 L40.5,37 M36,33.5 L37.5,38"/>
  </g>

  <!-- feet -->
  <ellipse cx="19" cy="51" rx="4" ry="3" fill="url(#ho-beak)" stroke="#5b5170" stroke-width="1"/>
  <ellipse cx="29" cy="51" rx="4" ry="3" fill="url(#ho-beak)" stroke="#5b5170" stroke-width="1"/>
  <path d="M16.5 52 l-1 1.6 M19 52.5 l0 1.6 M21.5 52 l1 1.6" stroke="#9c6a5c" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <path d="M26.5 52 l-1 1.6 M29 52.5 l0 1.6 M31.5 52 l1 1.6" stroke="#9c6a5c" stroke-width="0.9" fill="none" stroke-linecap="round"/>

  <!-- body + belly -->
  <ellipse cx="24" cy="38" rx="11" ry="13" fill="url(#ho-body)" stroke="#5b5170" stroke-width="1.4"/>
  <ellipse cx="24" cy="40" rx="7" ry="9.5" fill="url(#ho-belly)"/>
  <!-- belly speckles -->
  <g fill="#c9b9c6" opacity="0.7"><circle cx="22" cy="36" r="0.8"/><circle cx="26" cy="38" r="0.8"/><circle cx="23" cy="42" r="0.8"/><circle cx="25.5" cy="45" r="0.7"/></g>

  <!-- head group (bobs gently while idle) -->
  <g class="ho-head">
    <!-- ear tufts -->
    <path d="M15 12 C13 6 15 3 17 3 C18 5 18.5 8 18 11 Z" fill="url(#ho-body)" stroke="#5b5170" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M33 12 C35 6 33 3 31 3 C30 5 29.5 8 30 11 Z" fill="url(#ho-body)" stroke="#5b5170" stroke-width="1.1" stroke-linejoin="round"/>
    <!-- head -->
    <ellipse cx="24" cy="18" rx="12" ry="11" fill="url(#ho-body)" stroke="#5b5170" stroke-width="1.4"/>
    <!-- pale facial disk -->
    <path d="M24 9 C31 9 32 15 31.5 19 C31 24 27.5 26 24 26 C20.5 26 17 24 16.5 19 C16 15 17 9 24 9 Z" fill="url(#ho-belly)"/>
    <!-- bandit mask across the eyes -->
    <path d="M14.5 16 Q24 12.5 33.5 16 Q33 20.5 29 21.5 Q24 23 19 21.5 Q15 20.5 14.5 16 Z" fill="url(#ho-mask)"/>
    <!-- beak -->
    <path d="M21.5 21 L26.5 21 L24 25.5 Z" fill="url(#ho-beak)" stroke="#b07f6f" stroke-width="0.6" stroke-linejoin="round"/>

    <!-- eyes (blink occasionally) -->
    <g class="ho-eyes">
      <ellipse cx="19" cy="18" rx="3.7" ry="4.3" fill="#fff" stroke="#5b5170" stroke-width="0.5"/>
      <ellipse cx="29" cy="18" rx="3.7" ry="4.3" fill="#fff" stroke="#5b5170" stroke-width="0.5"/>
      <circle cx="19.5" cy="19" r="2.2" fill="#3a2533"/><circle cx="28.5" cy="19" r="2.2" fill="#3a2533"/>
      <circle cx="18.7" cy="18.2" r="0.8" fill="#fff"/><circle cx="27.7" cy="18.2" r="0.8" fill="#fff"/>
    </g>

    <!-- cheek blush -->
    <ellipse cx="15" cy="22" rx="2" ry="1.3" fill="#f0a0a8" opacity="0.5"/>
    <ellipse cx="33" cy="22" rx="2" ry="1.3" fill="#f0a0a8" opacity="0.5"/>
    <!-- little yellow crest tuft between the ears -->
    <path d="M24 7.5 Q22.6 4 24 1 Q25.4 4 24 7.5 Z" fill="#f0ecb0" stroke="#cdbf7a" stroke-width="0.4"/>
  </g>
</svg>
