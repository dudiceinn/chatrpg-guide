<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -5 48 61" width="48" height="61">
  <!-- Emberling: original fire-lizard companion (front/down view). Original IP —
       safe to use commercially. Idle life is baked in (animates even as an <img>/
       background, like trader-walk.svg): flame crest + tail ember flicker, a gentle
       head bob (breathing), and an occasional blink. The WALK bob is NOT here — the
       game adds that via a .walking class only while the creature moves. Rename freely. -->
  <defs>
    <linearGradient id="ek-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb866"/><stop offset="1" stop-color="#ef8326"/></linearGradient>
    <linearGradient id="ek-belly" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0d6"/><stop offset="1" stop-color="#ffd9a0"/></linearGradient>
    <linearGradient id="ek-flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff5a1e"/><stop offset="0.55" stop-color="#ff9a2e"/><stop offset="1" stop-color="#ffe46b"/></linearGradient>
    <radialGradient id="ek-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffd86b" stop-opacity="0.9"/><stop offset="1" stop-color="#ffd86b" stop-opacity="0"/></radialGradient>
    <style>
      .ek-flame, .ek-ember { transform-box: fill-box; transform-origin: center bottom; }
      .ek-f1    { animation: ek-flick 0.52s ease-in-out infinite alternate; }
      .ek-f2    { animation: ek-flick 0.44s ease-in-out infinite alternate; animation-delay: -0.12s; }
      .ek-f3    { animation: ek-flick 0.58s ease-in-out infinite alternate; animation-delay: -0.24s; }
      .ek-ember { animation: ek-flick 0.46s ease-in-out infinite alternate; }
      @keyframes ek-flick {
        0%   { transform: scaleY(1)    skewX(2deg); }
        100% { transform: scaleY(1.14) skewX(-3deg); }
      }
      /* idle head bob (gentle breathing nod) */
      .ek-head { transform-box: fill-box; transform-origin: center bottom; animation: ek-bob 2.6s ease-in-out infinite; }
      @keyframes ek-bob {
        0%, 100% { transform: translateY(0)     rotate(-0.7deg); }
        50%      { transform: translateY(-0.8px) rotate(0.7deg); }
      }
      /* occasional blink */
      .ek-eyes { transform-box: fill-box; transform-origin: center center; animation: ek-blink 4.6s ease-in-out infinite; }
      @keyframes ek-blink {
        0%, 90%, 100% { transform: scaleY(1); }
        94%, 96%      { transform: scaleY(0.08); }
      }
    </style>
  </defs>

  <ellipse cx="23" cy="53" rx="14" ry="3" fill="#000" opacity="0.18"/>

  <!-- tail + ember on the tip -->
  <path d="M31 42 C41 44 47 37 44 30 C43.4 28.4 41.8 28.4 41.4 30 C43 34 39 39 31 40 Z" fill="url(#ek-body)" stroke="#7a3b12" stroke-width="1.2"/>
  <g transform="translate(42.8 30.5) scale(0.72)"><path class="ek-ember" d="M -3 0 Q -4.5 -6 -1 -10 Q 0.5 -12 -0.2 -13.5 Q 2.5 -12.5 1.6 -9 Q 1 -7 2 -4.5 Q 3 -2 3 0 Q 0 1.2 -3 0 Z" fill="url(#ek-flame)" stroke="#c43a12" stroke-width="0.6"/></g>

  <!-- feet -->
  <ellipse cx="16" cy="49" rx="5" ry="4" fill="url(#ek-body)" stroke="#7a3b12" stroke-width="1.2"/>
  <ellipse cx="30" cy="49" rx="5" ry="4" fill="url(#ek-body)" stroke="#7a3b12" stroke-width="1.2"/>
  <path d="M12 50 l-1 2 M16 51 l0 2 M20 50 l1 2" stroke="#fff2d8" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M26 50 l-1 2 M30 51 l0 2 M34 50 l1 2" stroke="#fff2d8" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- body + belly + chest glow -->
  <ellipse cx="23" cy="37" rx="13" ry="14" fill="url(#ek-body)" stroke="#7a3b12" stroke-width="1.4"/>
  <ellipse cx="23" cy="39" rx="8" ry="10" fill="url(#ek-belly)"/>
  <circle cx="23" cy="38" r="6" fill="url(#ek-glow)"/>

  <!-- arms -->
  <ellipse cx="11" cy="36" rx="3.4" ry="5" fill="url(#ek-body)" stroke="#7a3b12" stroke-width="1.2"/>
  <ellipse cx="35" cy="36" rx="3.4" ry="5" fill="url(#ek-body)" stroke="#7a3b12" stroke-width="1.2"/>

  <!-- head group (bobs gently while idle) -->
  <g class="ek-head">
    <ellipse cx="23" cy="20" rx="12.5" ry="11.5" fill="url(#ek-body)" stroke="#7a3b12" stroke-width="1.4"/>
    <ellipse cx="23" cy="25" rx="6" ry="4" fill="url(#ek-belly)"/>
    <circle cx="21" cy="24" r="0.7" fill="#7a3b12"/><circle cx="25" cy="24" r="0.7" fill="#7a3b12"/>
    <path d="M19 26 q4 3 8 0" stroke="#7a3b12" stroke-width="1" fill="none" stroke-linecap="round"/>

    <!-- eyes (blink occasionally) -->
    <g class="ek-eyes">
      <ellipse cx="17.5" cy="18" rx="3.4" ry="4" fill="#fff"/><ellipse cx="28.5" cy="18" rx="3.4" ry="4" fill="#fff"/>
      <circle cx="18.3" cy="19" r="2" fill="#3a2110"/><circle cx="27.7" cy="19" r="2" fill="#3a2110"/>
      <circle cx="17.6" cy="18.2" r="0.7" fill="#fff"/><circle cx="27" cy="18.2" r="0.7" fill="#fff"/>
    </g>

    <!-- cheek blush -->
    <ellipse cx="13.5" cy="22.5" rx="2" ry="1.3" fill="#ff7a4a" opacity="0.55"/><ellipse cx="32.5" cy="22.5" rx="2" ry="1.3" fill="#ff7a4a" opacity="0.55"/>

    <!-- fire crest: wispy flame licks fanning out, centered on the head (x=23) -->
    <g fill="url(#ek-flame)" stroke="#c43a12" stroke-width="0.55">
      <g transform="translate(16.4 13.6) scale(0.82)"><path class="ek-flame ek-f1" d="M -3 0 Q -4.5 -6 -1 -10 Q 0.5 -12 -0.2 -13.5 Q 2.5 -12.5 1.6 -9 Q 1 -7 2 -4.5 Q 3 -2 3 0 Q 0 1.2 -3 0 Z"/></g>
      <g transform="translate(23 12.4) scale(-0.95 0.95)"><path class="ek-flame ek-f2" d="M -3 0 Q -4.5 -6 -1 -10 Q 0.5 -12 -0.2 -13.5 Q 2.5 -12.5 1.6 -9 Q 1 -7 2 -4.5 Q 3 -2 3 0 Q 0 1.2 -3 0 Z"/></g>
      <g transform="translate(29.6 13.6) scale(-0.82 0.82)"><path class="ek-flame ek-f3" d="M -3 0 Q -4.5 -6 -1 -10 Q 0.5 -12 -0.2 -13.5 Q 2.5 -12.5 1.6 -9 Q 1 -7 2 -4.5 Q 3 -2 3 0 Q 0 1.2 -3 0 Z"/></g>
    </g>
  </g>
</svg>
