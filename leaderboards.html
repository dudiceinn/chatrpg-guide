<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>ChatRPG — Leaderboards</title>
<style>
  :root { --bg:#0b0e1a; --panel:#141a2e; --line:#1f2a44; --gold:#ffd86b; --gold-soft:#ffe08a; --txt:#e6edf3; --dim:#8b97b3; }
  * { box-sizing: border-box; }
  body { margin:0; overflow-x:hidden; background:radial-gradient(1200px 800px at 50% -10%, #1a2238, #0b0e1a 60%); color:var(--txt);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }

  header { position:sticky; top:0; z-index:10; display:flex; align-items:center; flex-wrap:wrap;
           column-gap:10px; row-gap:6px; padding:10px 14px; background:rgba(11,14,26,0.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  header .brand { font-weight:900; font-size:16px; letter-spacing:0.02em; white-space:nowrap; }
  header .brand b { color:var(--gold); }
  header nav { margin-left:auto; display:flex; gap:4px; }
  header nav a { padding:5px 10px; border-radius:999px; font-weight:700; font-size:12px; color:var(--dim); white-space:nowrap; }
  header nav a:hover { color:var(--txt); background:var(--panel); }
  header nav a.active { color:var(--bg); background:var(--gold); }

  main { max-width:680px; margin:0 auto; padding:22px 16px 60px; }
  h1 { font-size:30px; font-weight:900; margin:6px 0 2px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:18px; }

  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .tab { flex:1 1 0; min-width:78px; padding:10px 8px; border-radius:12px; border:1px solid var(--line); background:var(--panel);
         color:var(--dim); font-weight:800; font-size:13px; cursor:pointer; text-align:center; transition:.15s; }
  .tab.active { color:var(--bg); border-color:transparent; }
  .tab.level.active{ background:var(--gold); } .tab.ore.active{ background:#e2a76a; }
  .tab.gold.active{ background:#ffe9a8; } .tab.hearts.active{ background:#ff8aa0; }

  .search { width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--line); background:var(--panel);
            color:var(--txt); font-size:14px; margin-bottom:16px; }
  .search::placeholder { color:var(--dim); }

  .board { display:flex; flex-direction:column; gap:7px; }
  .row { display:flex; align-items:center; gap:11px; padding:11px 14px; border-radius:13px; background:var(--panel); border:1px solid var(--line); }
  .row.hit { outline:2px solid var(--gold); }
  .rank { width:30px; text-align:center; font-weight:900; font-size:15px; color:var(--dim); flex-shrink:0; }
  .row.top1 .rank,.row.top2 .rank,.row.top3 .rank { font-size:19px; }
  .row.top1 { border-color:rgba(255,216,107,.6); box-shadow:0 0 16px rgba(255,216,107,.18); }
  .row.top2 { border-color:rgba(200,210,220,.45); }
  .row.top3 { border-color:rgba(205,127,50,.45); }
  .cls { font-size:18px; flex-shrink:0; }
  .name { flex:1; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .val { font-weight:900; font-variant-numeric:tabular-nums; }
  .val { color:var(--gold-soft); }
  .empty { text-align:center; color:var(--dim); padding:40px 0; }
  footer { text-align:center; color:var(--dim); font-size:12px; margin-top:22px; }
</style>
</head>
<body>
<header>
  <div class="brand"><b>CHATTARA</b> RPG</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="howtoplay.html">Guide</a>
    <a href="leaderboards.html" class="active">Ranks</a>
  </nav>
</header>

<main>
  <h1>🏆 Leaderboards</h1>
  <div class="sub" id="updated">Loading…</div>

  <div class="tabs" id="tabs">
    <div class="tab level active" data-metric="level">🏆 Level</div>
    <div class="tab ore"        data-metric="ore">⛏️ Ore</div>
    <div class="tab gold"       data-metric="gold">💰 Gold</div>
    <div class="tab hearts"     data-metric="hearts">❤️ Hearts</div>
  </div>

  <input class="search" id="search" type="text" placeholder="Search your name…" autocomplete="off"/>

  <div class="board" id="board"><div class="empty">Loading…</div></div>

  <footer>Updated each stream — all-time standings · Tara!</footer>
</main>

<script>
  var CLASS_ICONS = { warrior:"⚔️", mage:"🔮", rogue:"🗡️", ranger:"🏹" };
  var state = { players: [], metric: "level", q: "" };

  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function fmt(n){ return (Number(n)||0).toLocaleString(); }
  function ago(ms){
    var s = Math.max(0, Math.floor((Date.now()-ms)/1000));
    if (s < 90) return "just now";
    var m = Math.floor(s/60); if (m < 60) return m+" min ago";
    var h = Math.floor(m/60); if (h < 24) return h+" hr ago";
    return Math.floor(h/24)+" days ago";
  }

  function render(){
    var board = document.getElementById("board");
    var ranked = state.players.slice().sort(function(a,b){ return (b[state.metric]||0)-(a[state.metric]||0); });
    var q = state.q.trim().toLowerCase();
    if (!ranked.length){ board.innerHTML = '<div class="empty">No players yet — be the first!</div>'; return; }
    board.className = "board lv-"+state.metric;
    board.innerHTML = ranked.map(function(p, i){
      var rank = i+1;
      var medal = rank===1?"🥇":rank===2?"🥈":rank===3?"🥉":(rank+".");
      var top = rank<=3 ? (" top"+rank) : "";
      var hit = q && p.name.toLowerCase().indexOf(q) !== -1 ? " hit" : "";
      var icon = CLASS_ICONS[p.cls] || "🎮";
      return '<div class="row'+top+hit+'">'+
        '<div class="rank">'+medal+'</div>'+
        '<div class="cls">'+icon+'</div>'+
        '<div class="name">'+esc(p.name)+'</div>'+
        '<div class="val">'+fmt(p[state.metric])+'</div>'+
      '</div>';
    }).join("");
  }

  function setMetric(m){
    state.metric = m;
    var tabs = document.querySelectorAll("#tabs .tab");
    for (var i=0;i<tabs.length;i++) tabs[i].classList.toggle("active", tabs[i].getAttribute("data-metric")===m);
    render();
  }

  document.getElementById("tabs").addEventListener("click", function(e){
    var t = e.target.closest(".tab"); if (t) setMetric(t.getAttribute("data-metric"));
  });
  document.getElementById("search").addEventListener("input", function(e){ state.q = e.target.value; render(); });

  fetch("leaderboard.json?t=" + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      state.players = (d && d.players) || [];
      document.getElementById("updated").textContent =
        state.players.length + " players · updated " + ago((d && d.updatedAt) || Date.now());
      render();
    })
    .catch(function(){
      document.getElementById("updated").textContent = "Leaderboard not available yet.";
      document.getElementById("board").innerHTML = '<div class="empty">No data yet — check back after a stream!</div>';
    });
</script>
</body>
</html>
